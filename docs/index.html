<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>bonsai/latest</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#17202a;background:#f6f7f9}body{margin:0}header{position:sticky;top:0;background:white;border-bottom:1px solid #ddd;padding:16px 20px;z-index:2}h1{margin:0;font-size:20px}.sub{color:#667085;font-size:13px;margin-top:4px}main{max-width:1200px;margin:auto;padding:18px}.bar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}button,input,select{border:1px solid #ccc;background:white;border-radius:8px;padding:8px 12px}button{cursor:pointer}.status{font-size:13px;color:#667085}.grid{display:grid;gap:8px}.item{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:white;border:1px solid #e3e5e8;border-radius:10px;padding:12px 14px;text-decoration:none;color:inherit}.name{font-weight:650}.desc{font-size:12px;color:#667085;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:#667085;text-align:right}.pill{display:inline-block;border:1px solid #ddd;border-radius:999px;padding:2px 7px;margin:2px;font-size:11px}.err{padding:16px;background:#fff0f0;border:1px solid #f2b8b8;border-radius:8px;color:#a33}.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button.active{font-weight:700;border-color:#111}.hidden{display:none}@media(max-width:650px){.item{grid-template-columns:1fr}.meta{text-align:left}.desc{white-space:normal}}
</style>
</head>
<body>
<header><h1>bonsai/latest</h1><div class="sub">Repository activity + cross-repository Issues — current working set</div></header>
<main>
<div class="tabs"><button id="reposTab" class="active">Repos</button><button id="issuesTab">Issues</button></div>
<section id="repos"><div class="bar"><button id="refreshRepos">↻ Refresh</button><span class="status" id="repoStatus">loading…</span></div><div id="repoList" class="grid"></div></section>
<section id="issues" class="hidden"><div class="bar"><button id="refreshIssues">↻ Refresh</button><input id="issueSearch" placeholder="repo / title / label"><select id="issueState"><option value="all">all</option><option value="open">open</option><option value="closed">closed</option></select><span class="status" id="issueStatus">loading…</span></div><div id="issueList" class="grid"></div></section>
</main>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const score=r=>{const age=Math.max(0,(Date.now()-new Date(r.pushed_at||r.updated_at))/86400000);let s=100*Math.exp(-age/14);s+=Math.min(r.stargazers_count,50)*.25;s+=Math.min(r.open_issues_count,30)*.35;if(r.archived)s*=.1;return Math.round(s*10)/10};
async function loadRepos(){const st=repoStatus,list=repoList;st.textContent='loading…';list.innerHTML='';try{const res=await fetch('https://api.github.com/users/bonsai/repos?per_page=100&sort=updated&direction=desc&type=owner');if(!res.ok)throw Error(res.status+' '+res.statusText);const repos=await res.json();repos.filter(r=>!r.fork&&!r.archived).sort((a,b)=>score(b)-score(a)).slice(0,30).forEach((r,i)=>{const a=document.createElement('a');a.className='item';a.href=r.html_url;a.target='_blank';a.rel='noopener';a.innerHTML=`<div><div class="name">${String(i+1).padStart(2,'0')}　${esc(r.name)}</div><div class="desc">${esc(r.description||'')}</div></div><div class="meta"><b>${score(r)}</b><br>${esc(r.language||'—')} · ★ ${r.stargazers_count} · issues ${r.open_issues_count}</div>`;list.appendChild(a)});st.textContent=`${list.children.length} repos · ${new Date().toLocaleString('ja-JP')}`}catch(e){list.innerHTML=`<div class="err">取得失敗: ${esc(e.message)}</div>`;st.textContent='error'}}
let issueData=[];
async function loadIssues(){const st=issueStatus,list=issueList;st.textContent='loading…';try{const res=await fetch('./data/issues.json',{cache:'no-store'});if(!res.ok)throw Error('data/issues.json '+res.status);const data=await res.json();issueData=data.issues||[];renderIssues();st.textContent=`${issueData.length} issues · generated ${esc(data.generated_at||'—')}`}catch(e){list.innerHTML=`<div class="err">Issue DB未配置または未収集: ${esc(e.message)}</div>`;st.textContent='error'}}
function renderIssues(){const q=issueSearch.value.toLowerCase();const state=issueState.value;const rows=issueData.filter(x=>(state==='all'||x.state===state)&&[x.repo,x.title,...(x.labels||[]).map(l=>l.name)].join(' ').toLowerCase().includes(q)).sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at)).slice(0,500);issueList.innerHTML='';rows.forEach(x=>{const a=document.createElement('a');a.className='item';a.href=x.url;a.target='_blank';a.rel='noopener';const labels=(x.labels||[]).map(l=>`<span class="pill">${esc(l.name)}</span>`).join('');a.innerHTML=`<div><div class="name">${esc(x.repo)} #${x.number} — ${esc(x.title)}</div><div>${labels}</div><div class="desc">${esc(x.body||'')}</div></div><div class="meta">${esc(x.state)}<br>updated ${esc(x.updated_at)}<br>💬 ${x.comments||0}</div>`;issueList.appendChild(a)});issueStatus.textContent=`${rows.length} shown / ${issueData.length} total`}
reposTab.onclick=()=>{repos.classList.remove('hidden');issues.classList.add('hidden');reposTab.classList.add('active');issuesTab.classList.remove('active')};issuesTab.onclick=()=>{repos.classList.add('hidden');issues.classList.remove('hidden');reposTab.classList.remove('active');issuesTab.classList.add('active');if(!issueData.length)loadIssues()};refreshRepos.onclick=loadRepos;refreshIssues.onclick=loadIssues;issueSearch.oninput=renderIssues;issueState.onchange=renderIssues;loadRepos();
</script>
</body>
</html>
